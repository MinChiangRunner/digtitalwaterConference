<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大会查询入口</title>
  <style>
    :root { color-scheme: light; --ink:#0f172a; --muted:#64748b; --line:#dbe7f3; --blue:#2563eb; --green:#059669; --amber:#d97706; --bg:#f6faff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:"Microsoft YaHei", "PingFang SC", Arial, sans-serif; background:linear-gradient(180deg,#f6faff,#eef6ff); color:var(--ink); }
    header { padding:28px 32px 18px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.9); }
    main { max-width:1120px; margin:0 auto; padding:24px 24px 42px; }
    h1 { margin:0 0 8px; font-size:30px; letter-spacing:0; }
    .meta { color:var(--muted); font-size:14px; }
    .dashboard { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:20px; }
    .metric { display:block; min-height:136px; padding:20px; border:1px solid var(--line); border-radius:8px; background:white; color:var(--ink); text-decoration:none; box-shadow:0 10px 28px rgba(15,23,42,.06); }
    .metric b { display:block; font-size:38px; line-height:1; margin-bottom:10px; color:var(--blue); }
    .metric span { display:block; color:var(--muted); font-size:15px; }
    .metric small { display:block; margin-top:12px; color:var(--blue); font-size:13px; }
    .metric.paid b { color:var(--green); }
    .metric.unpaid b { color:var(--amber); }
    .metric.unregistered b { color:#dc2626; }
    .metric.unpaid { cursor:pointer; }
    .links { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .link { display:block; padding:24px; border:1px solid var(--line); border-radius:8px; background:white; color:var(--ink); text-decoration:none; box-shadow:0 10px 28px rgba(15,23,42,.06); }
    .link b { display:block; font-size:24px; margin-bottom:8px; color:var(--blue); }
    .link span { color:var(--muted); }
    @media (max-width: 800px) { .dashboard, .links { grid-template-columns:1fr; } header { padding:24px; } }
  </style>
</head>
<body>
  <header>
    <h1>大会数据看板</h1>
    <div class="meta" id="meta">正在加载数据...</div>
  </header>
  <main>
    <section class="dashboard" id="dashboard"></section>
    <section class="links">
      <a class="link" href="soil.html"><b>土壤水研究大会</b><span>查看报告人、专题、单位排行和缴费状态</span></a>
      <a class="link" href="water.html"><b>数字水圈论坛</b><span>查看报告人、专题、单位排行和缴费状态</span></a>
    </section>
  </main>
  <script>
    const val = x => x == null ? '' : String(x);
    fetch('data.json?t=' + Date.now()).then(r=>r.json()).then(data => {
      const summary = data.payment_summary || {};
      const allRows = (data.all_registrants && data.all_registrants.rows) || [];
      const unpaidRows = (data.registered_unpaid && data.registered_unpaid.rows) || [];
      const total = allRows.length || summary.total_registered || 0;
      const paid = allRows.filter(r => r['注册缴费状态'] === '已注册已缴费').length || summary.paid || 0;
      const unpaid = allRows.filter(r => r['注册缴费状态'] === '已注册未缴费').length || summary.unpaid || unpaidRows.filter(r => r['注册缴费状态'] === '已注册未缴费').length || 0;
      const unregistered = allRows.filter(r => r['注册缴费状态'] === '未注册未缴费').length;
      document.getElementById('meta').textContent = `数据截止时间：${val(data.meta && data.meta.generated_at)} ｜ 未缴费清单：${val(data.registered_unpaid && data.registered_unpaid.source_file) || '未找到'}`;
      document.getElementById('dashboard').innerHTML = [
        `<a class="metric" href="all-registrants.html"><b>${total}</b><span>总人员数</span><small>点击查看所有注册人员</small></a>`,
        `<a class="metric paid" href="all-registrants.html?status=${encodeURIComponent('已注册已缴费')}"><b>${paid}</b><span>已缴费人数</span><small>点击查看已缴费人员</small></a>`,
        `<a class="metric unpaid" href="all-registrants.html?status=${encodeURIComponent('已注册未缴费')}"><b>${unpaid}</b><span>已注册未缴费</span><small>点击查看未缴费人员</small></a>`,
        `<a class="metric unregistered" href="all-registrants.html?status=${encodeURIComponent('未注册未缴费')}"><b>${unregistered}</b><span>未注册未缴费</span><small>来自手动补充报告</small></a>`,
      ].join('');
    }).catch(err => {
      document.getElementById('meta').textContent = `数据加载失败：${err && err.message ? err.message : err}`;
    });
  </script>
</body>
</html>
